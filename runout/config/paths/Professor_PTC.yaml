# Path profile: Little Professor (Loveland Pass, US-6), the /home/avachain
# deployment (path name Professor_PTC). Same path as little_professor.yaml,
# with the deployment's static files given as absolute paths: runout's own
# root (avachain_root) is the per-path work dir under work/runout/, written by
# src/avachain/runout_step.py, so relative names would not resolve to
# /home/avachain/data. Keep display: in step with little_professor.yaml.

slug: Professor_PTC
display:
  project_name: Little Professor
  subtitle: Loveland Pass, US-6
  highway: US-6
  # Shown in the report's "Inputs and caveats" box (Ron, 2026-11-02;
  # debris and DEM caveats rewritten 2026-11-03 after Val's reply). These
  # hold for every cycle of this path; event_caveats below only for the
  # cycle of that date (Ron, 2026-11-03: the Jan 18 notes are last season's
  # and must not reach a live 2026-27 report).
  caveats:
    - "τ₀ = 125 Pa was fitted to a single avalanche (2026-01-18), on last season's DEM pair. It has not been tested on any other event, or on this season's ground DEM (2026-10-18, surveyed ground control), which sits a median 0.2 m above last season's runout DEM with slopes within 0.3°."
    - "Entrainment depth comes from the release side's scour_depth.tif, which covers only the snowpack model's domain. Below that domain the flow entrains nothing."
  # Keyed by cycle date (YYYY-MM-DD); shown before the general caveats.
  event_caveats:
    "2026-01-18":
      - "τ₀ was fitted to this avalanche, so this day's runout is not an independent test."
      - "Val drew the observed debris from the 2026-01-20 orthophoto, two days after the event, so its toe is approximate. The modelled runouts have not been scored against it."
      - "Last season's surveys had no shared ground control, so the snow-free surfaces differ by about 1 m (the runout DEM, 260605, sits a median 1.1 m below the snowpack DEM, 251110). This does not enter com1DFA: snow height is a thickness laid onto 260605, and τ₀ was fitted with the same pairing."

terrain:
  # 1 m average of the snowpack side's 261018 0.05 m surface, on 260605's grid
  # alignment (one surface for both parts since 2026-11-07; was 260605).
  dem: /home/avachain/data/static/Professor_PTC/terrain/261018_Professor_Ground-DSM_1m_6342-NAVD88.tif
  dem_feather_cells: 5
  dem_vertical_correction_m: 0.0

canopy:
  forest: /home/avachain/data/static/Professor_PTC/canopy/forest.shp

infrastructure:
  road: /home/avachain/data/static/Professor_PTC/infrastructure/cdot_US6_LP_LittleProfessor.shp
  # no reference points layer in the deployment yet
  reference_points: null

release:
  # forecast mode takes release areas from the chain's scenarios
  start_zone: null

entrainment:
  # forecast mode entrains the release side's scour_depth.tif (rule B)
  polygon: null

road:
  buffer_m: 1.0
  chainage_origin: far_from_release

reference_points:
  radius_m: 10.0
