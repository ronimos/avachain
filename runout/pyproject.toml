[project]
name = "avachain-runout"
version = "3.0.0"
description = "Runout side of avachain: com1DFA scenario ensembles -> probability of reach"
requires-python = ">=3.12,<3.13"
# Its own environment because avaframe 2.1 pins numpy<2.0 and the snowpack
# side's xsnow needs numpy>=2.3.2; the two meet only through handoff files.
dependencies = [
    "avaframe==2.1",
    "numpy>=1.24,<2.0",
    "pandas>=2.0",
    "scipy>=1.10",
    "pyyaml>=6.0",
    "rasterio>=1.3",
    "fiona>=1.9",
    "shapely>=2.0",
    "geopandas>=0.14",
    "pyproj>=3.6",
    "matplotlib>=3.7",
    "jinja2>=3.1",
    "folium>=0.15",
    "branca>=0.7",
    "scikit-image>=0.22",
    "pillow>=10.0",
    "openpyxl>=3.1",
]

[tool.uv]
package = false
