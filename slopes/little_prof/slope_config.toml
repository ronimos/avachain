# slope_config.toml — Little Professor slope

[slope]
name             = "little_prof"
display_name     = "Little Professor"
aspect_deg       = 90.0
slope_angle_deg  = 38.0
elevation_m      = 3700
latitude         = 39.63
longitude        = -105.87
notes            = "NE-facing slope above treeline; primary study slope for CDOT/ISSW 2026"

[paths]
project_dir           = "/home/ron/avachain"
dem                   = "data/dem/251110_Professor_Ground-DSM_aligned.tiff"
survey_dir            = "data/surveys"
weather_csv           = "data/weather/weather_data.csv"
boundary_kml          = "data/boundaries/Little_Proff.kml"
start_zone_kml        = "data/boundaries/Litte_prof_start_zone.kml"
release_geojson       = "data/boundaries/avalanche_release_area.geojson"
# Validation targets (survey-derived release polygons, survey_release_polygon.py).
# Preferred over boundaries/ for scoring only; reinit keeps the mapped crown.
validation_dir        = "data/validation"
output_dir            = "outputs/little_prof"
windninja_library_dir = "windninja/library"
slope_dir             = "snowpack/little_prof"

[snowpack]
binary     = "/home/caic/caic/rtsys/snowpack/exe/snowpack"
lib_dir    = "/home/caic/caic/rtsys/snowpack/src/snowpack/lib"
season_start      = "2025-10-01"
season_end        = "2026-03-31"
max_parallel_jobs = 30

[[stations]]
role        = "summit"
sql_id      = "CAABT"
name        = "A-Basin SA-Summit"
lat         = 39.6424
lon         = -105.8718
elev_m      = 3798.3
sql_columns = ["swin", "temp", "dewp", "rh", "wspd", "wdir", "gust", "mxtemp24h", "mntemp24h"]

[[stations]]
role        = "base"
sql_id      = "CAABM"
name        = "A-Basin SA-Base"
lat         = 39.6424
lon         = -105.8718
elev_m      = 3554.0
sql_columns = ["pcpac", "depth", "snow24h"]

[scenarios]
n_triggers        = 5
size_factors      = [0.70, 0.85, 1.00, 1.15, 1.30]
depth_percentiles = [10, 50, 90]
stauchwall_deg    = 29.0
# Explosive-control shot locations, [lat, lon] WGS84. On a day when no cluster
# passes the trigger gates, the clusters containing these points are the
# triggers. Fixed on the ground, so they hold for any season's cluster map.
# Centres of 2025-26 clusters 3500, 2568, 2480 and 4137 (Ron, 2026-11-04).
explosive_trigger_points = [
    [39.6488366, -105.8788572],
    [39.6487075, -105.8782511],
    [39.6484944, -105.8791514],
    [39.6481336, -105.8787209],
]
# Also publish a forced-shot set every run at <scenarios>/<date>/shots[/T_n]:
# a trigger at every point above, no initiation gate (a shot always
# initiates), and the release model decides only whether it propagates (no
# rectangle fallback). Each shot holds 1/N; a shot that does not release
# counts as no release (P per shot fired). The model set is unchanged.
# runout_step runs it as a second runout, published under
# <publish_root>/shots/. CLI: --force-explosive-triggers.
force_explosive_triggers = false

[wrf]
fcst_base_dir = "/ssd/snowpack/fcst"
season        = ""
# Filled in by install.py:
wrf_smet_dir  = "/ssd/snowpack/fcst/2025/zone055/077963"
wrf_zone      = "zone055"
wrf_grid_id   = "077963"
wrf_smet_file = "/ssd/snowpack/fcst/2025/zone055/077963/0779632_res.smet"
wrf_dist_km   = 0.714

[cron]
hour_utc = 3

[calibration]
# Release-model calibration (calibration.py; CLAUDE.md "Calibration").
# Approved by Ron 2026-11-10: trigger toughness (module default) + caps off + facet 0.75.
version        = "2026-11-10.1"
facet_a        = 0.75     # the one fitted knob: J&J 1990 facet knockdown (module default 0.5)
distance_caps  = false    # structural: BFS up/down/cross caps open
events         = ["2026-01-18"]
no_event_dates = ["2026-01-29", "2026-02-05", "2026-02-12", "2026-02-19", "2026-02-26",
                  "2026-03-05", "2026-03-07", "2026-03-12", "2026-03-19", "2026-03-26"]
objective      = "Jan 18 E[IoU] vs the 5810 m2 survey polygon; ski-track non-triggers must not release (forced shots, no rectangle). No-event area reported, not scored."
fitted         = "Jan 18 E[IoU] 0.589 (was 0.200), E[area] 7682 m2 (1.32x); ski 0/46 releasing (was 13/46); facet 0.75 and sigma_t x0.5 behave alike. A fit, not validation."
commit         = "68a170f"
sweep          = "11-09 J&J/facet sweeps + trigger-toughness/caps-off combined run; acceptance 11-10 identical on all 11 dates"
