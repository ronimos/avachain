# slope_config.toml — Little Professor, operational deployment in /home/avachain
#
# Same slope and physics as slopes/little_prof (the dev tree); only the paths
# differ. The slope name is the survey producer's path token, so survey files
# (YYMMDD_Professor_PTC_snowHeight.tif), folders, scripts and logs share one
# name. Layout (Ron, 2026-10-28):
#   data/      external arrivals only; nothing in the pipeline writes here,
#              except the survey markers (READY -> RUNNING -> DONE/FAILED)
#   work/      each part's private files
#   handoff/   the only place parts exchange files (manifest.json + READY)
#   outputs/   products;  logs/
# Every path is absolute, so nothing resolves into the repo at code/avachain.

[slope]
name             = "Professor_PTC"
display_name     = "Little Professor"
aspect_deg       = 90.0
slope_angle_deg  = 38.0
elevation_m      = 3700
latitude         = 39.63
longitude        = -105.87
notes            = "NE-facing slope above treeline; operational deployment of slopes/little_prof"

[paths]
project_dir           = "/home/avachain/code/avachain"   # stamped by install.py
# --- arrivals (data/) ---
survey_dir            = "/home/avachain/data/surveys/snow_height/Professor_PTC"
weather_csv           = "/home/avachain/data/weather/weather_data.csv"
# 2026-10-18 snow-free ground DEM with surveyed GCPs (Zarter), 0.05 m; replaced 251110
# on 2026-11-07. NAD83(2011) / UTM 13N, heights NAD83(2011) ELLIPSOIDAL (no geoid), like
# the rest of the series: snow surveys must be in the same frame (docs/deployment.md 2.1).
# The runout's terrain.dem is its 1 m average.
dem                   = "/home/avachain/data/static/Professor_PTC/terrain/261018_Professor_Ground-DSM_5cm_6342-ellipsoid.tif"
boundary_kml          = "/home/avachain/data/static/Professor_PTC/Little_Proff.kml"
start_zone_kml        = "/home/avachain/data/static/Professor_PTC/Litte_prof_start_zone.kml"
# boundary_kml's folder is also where mapped crowns (avalanche_release_area_<YYYYMMDD>.geojson) are read
release_geojson       = "/home/avachain/data/static/Professor_PTC/avalanche_release_area.geojson"
validation_dir        = "/home/avachain/data/static/Professor_PTC/validation"
# --- snowpack part (work/) ---
slope_dir             = "/home/avachain/work/snowpack/Professor_PTC"
grids_dir             = "/home/avachain/work/snowpack/Professor_PTC/hourly_grids"
resampled_dir         = "/home/avachain/work/snowpack/Professor_PTC/resampled_1m"
models_dir            = "/home/avachain/work/snowpack/Professor_PTC/models"
weather_cache_dir     = "/home/avachain/work/weather"
# The avalanche step appends auto-detected events to this file, so it cannot live in data/.
avalanche_events      = "/home/avachain/work/snowpack/Professor_PTC/avalanche_events.json"
# --- release part (work/) ---
# analysis_dir also holds the forcing pipeline's cluster map and features:
# one analysis_dir serves both parts today.
analysis_dir          = "/home/avachain/work/release/Professor_PTC/analysis"
event_masks_dir       = "/home/avachain/work/release/Professor_PTC/event_masks"
# --- release -> runout (handoff/) ---
scenarios_dir         = "/home/avachain/handoff/Professor_PTC/release"
# --- products and logs ---
output_dir            = "/home/avachain/outputs/Professor_PTC"
plots_dir             = "/home/avachain/outputs/Professor_PTC/plots"
logs_dir              = "/home/avachain/logs/Professor_PTC"
# --- season analytics (metrics.py, docs/analytics_design.md) ---
# records: <metrics_dir>/<season>/{runs,surveys,cycles,observations}.jsonl
metrics_dir           = "/home/avachain/work/metrics/Professor_PTC"
# what forecasters were shown: <issued_dir>/<season>/<cycle>/ (forecast-store
# snapshots, superseded release sets and reports)
issued_dir            = "/home/avachain/archive/Professor_PTC/issued"

[surveys]
# A survey counts once its marker is RUNNING or DONE (survey_markers.py).
markers = true

[snowpack]
binary     = "/home/caic/caic/rtsys/snowpack/exe/snowpack"
lib_dir    = "/home/caic/caic/rtsys/snowpack/src/snowpack/lib"
# 2026-27 (Ron, 2026-11-04). The season starts from bare ground on
# season_start (season_start.py bootstrap): it must be snow-free and on or after
# the WRF refill file's first row (2026-10-14 12:00). Snow on the ground at
# season_start is not in the simulation. 11-07: the WRF-forced SNOWPACK at the
# Professor cell melts the October snow out about then; starting there keeps
# any later snow (a likely basal layer) in the simulation. Operational go-live
# stays separate (planned for 2026-11-20). 2025-26: 2025-10-01 .. 2026-03-31.
season_start      = "2026-11-07"
season_end        = "2027-05-15"
start_from_bare_ground = true
max_parallel_jobs = 30

# Station data from the database cache (work/weather/<station>.parquet, filled
# by aws_ingest.py), no CSV this season.
[weather]
source = "cache"

[[stations]]
role        = "summit"
sql_id      = "CAABT"
name        = "A-Basin SA-Summit"
lat         = 39.6424
lon         = -105.8718
elev_m      = 3798.3
sql_columns = ["swin", "temp", "dewp", "rh", "wspd", "wdir", "gust", "mxtemp24h", "mntemp24h"]

[[stations]]
role        = "base"
sql_id      = "CAABM"
name        = "A-Basin SA-Base"
lat         = 39.6424
lon         = -105.8718
elev_m      = 3554.0
sql_columns = ["pcpac", "depth", "snow24h"]

[scenarios]
n_triggers        = 5
size_factors      = [0.70, 0.85, 1.00, 1.15, 1.30]
depth_percentiles = [10, 50, 90]
stauchwall_deg    = 29.0
# One snapshot time for every read (features, release depth, scour): 18 UTC
# = 11:00 MST / 12:00 MDT, on SNOWPACK's 6 h profile grid (Ron, 2026-11-04).
snapshot_hour_utc = 18
# Forecast days per cycle: T_0 (today), T_1, T_2, each from the observed or
# the NWP forecast store at snapshot_hour_utc (analysis_pipeline forecast).
forecast_days     = 3
# Explosive-control shot locations, [lat, lon] WGS84. On a day when no cluster
# passes the trigger gates, the clusters containing these points are the
# triggers. Fixed on the ground, so they hold for any season's cluster map.
# Centres of 2025-26 clusters 3500, 2568, 2480 and 4137 (Ron, 2026-11-04).
explosive_trigger_points = [
    [39.6488366, -105.8788572],
    [39.6487075, -105.8782511],
    [39.6484944, -105.8791514],
    [39.6481336, -105.8787209],
]
# Also publish a forced-shot set every run at <scenarios>/<date>/shots[/T_n]:
# a trigger at every point above, no initiation gate (a shot always
# initiates), and the release model decides only whether it propagates (no
# rectangle fallback). Each shot holds 1/N; a shot that does not release
# counts as no release (P per shot fired). The model set is unchanged.
# runout_step runs it as a second runout, published under
# <publish_root>/shots/. CLI: --force-explosive-triggers.
# On for Professor_PTC (Ron, 2026-11-06).
force_explosive_triggers = true

# NWP forecast pass: T_stable -> T_stable + lead_hours, clamped to the WRF
# outlook's last timestamp. 60 h (Ron, 2026-11-04): the daily run at 00:00
# local has T_stable ~06 UTC, and T+2's 18 UTC snapshot is 60 h later.
[nwp]
lead_hours = 60

[wrf]
fcst_base_dir = "/ssd/snowpack/fcst"
season        = ""
# Filled in by install.py:
wrf_smet_dir  = "/ssd/snowpack/fcst/2025/zone055/077963"
wrf_zone      = "zone055"
wrf_grid_id   = "077963"
wrf_smet_file = "/ssd/snowpack/fcst/2025/zone055/077963/0779632_res.smet"
wrf_dist_km   = 0.714

[cron]
# Times are in `timezone` (written as CRON_TZ into the cron.d file; DST
# follows). Ron, 2026-11-04: the runout report is due at 03:00 local, so the
# daily run starts at 00:00 local (~2 h 15 m with three forecast days of
# runout) and alerts.py check-report runs at 03:15. With [surveys] markers on,
# hour_utc is unused: run_Professor_PTC.sh is polled every poll_minutes.
timezone       = "America/Denver"
hour_utc       = 3
poll_minutes   = 10
daily_hour     = 0
report_check   = "03:15"
# The jobs (survey poll, daily run, hourly WRF archive) go to one /etc/cron.d
# file, not a personal crontab (Ron, 2026-11-04). install.py writes it to
# crond_dir/avachain-<slope>; install it with the sudo command it prints.
user           = "ron"
crond_dir      = "/home/avachain/cron"

# ---------------------------------------------------------------------------
# [runout] — com1DFA runout after each published release set
# (src/avachain/runout_step.py, chained at the end of run_<slope>.sh and
# run_daily_<slope>.sh; Ron, 2026-11-04). Without this table the step is
# skipped. A runout failure leaves the survey DONE; rerun it alone with
#   python src/avachain/runout_step.py --toml <this file> --snapshot-date D
# ---------------------------------------------------------------------------
[runout]
path_profile = "Professor_PTC"                       # runout/config/paths/<name>.yaml
work_dir     = "/home/avachain/work/runout/Professor_PTC"
publish_root = "/home/www/html/ron/runout_forecast"  # -> forecasts/Professor_PTC/<date>/, latest/
lock_file    = "/home/avachain/work/runout/.runout.lock"   # one for every slope: 4 sims at most

# ---------------------------------------------------------------------------
# [alerts] — who is told when the chain needs attention (alerts.py): a survey
# marked FAILED, a runout failure, a failed daily run, and (cron, 17 UTC) no
# daily run for 26 h in the season. Sent through the local sendmail. With an
# empty list alerts are only printed to the run's log.
# ---------------------------------------------------------------------------
# Addresses go in the recipients file, NOT here: this repo is public.
# Default file ~/.config/avachain/alerts.toml (email = [...]) of the user cron
# runs as; override with recipients_file.
[alerts]
email = []
