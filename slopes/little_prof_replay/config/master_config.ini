; master_config.ini — Little Professor (replay)
; Generated by install.py from slopes/little_prof_replay/slope_config.toml.
; Contains SNOWPACK physics settings shared by all clusters.
; Per-cluster paths are provided via IMPORT_BEFORE in run_snowpack.sh.

[GENERAL]
BUFFER_SIZE = 370
BUFF_BEFORE = 1.5

[GENERATORS]
PSUM_PH::GENERATORS          = PRECSPLITTING
PSUM_PH::PRECSPLITTING::SNOW = 274.35
PSUM_PH::PRECSPLITTING::TYPE = THRESH

[INPUT]
; METEO and SNOW name the MeteoIO plugins for the forcing .smet and the
; restart .sno. Without them SNOWPACK aborts with "No plugin defined for
; METEO" before reading any data; the per-cluster .ini only supplies paths.
METEO      = SMET
SNOW       = SMET
TIME_ZONE  = 0
COORDSYS   = UTM
COORDPARAM = 10T

[INPUTEDITING]
*::ARG1::ALGORITHM = CST
*::ARG1::PARAM     = TSG
*::ARG1::VALUE     = 273.15
*::EDIT1           = CREATE

[INTERPOLATIONS1D]
PSUM::ARG1::PERIOD = 900
PSUM::RESAMPLE1    = ACCUMULATE

[OUTPUT]
TIME_ZONE            = 0
METEO                = SMET
SNOW                 = SMET
EXPERIMENT           = res
TS_WRITE             = TRUE
TS_FORMAT            = SMET
TS_START             = 0.0
TS_DAYS_BETWEEN      = 0.25
PROFILE_FORMAT       = PRO
PROF_WRITE           = TRUE
PROF_START           = 0.0
PROF_DAYS_BETWEEN    = 0.25
PROF_AGE_OR_DATE     = DATE
OUT_STAB             = TRUE
OUT_HEAT             = TRUE
OUT_SW               = TRUE
OUT_LW               = TRUE
OUT_MASS             = TRUE
OUT_T                = TRUE
HAZ_WRITE            = TRUE
HAZARD_STEPS_BETWEEN = 2
PRECIP_RATES         = TRUE

[SNOWPACK]
ATMOSPHERIC_STABILITY      = NEUTRAL
CALCULATION_STEP_LENGTH    = 15
CANOPY                     = FALSE
CHANGE_BC                  = FALSE
ENFORCE_MEASURED_SNOW_HEIGHTS = TRUE
HEIGHT_OF_METEO_VALUES     = 2
HEIGHT_OF_WIND_VALUE       = 10
MEAS_TSS                   = FALSE
ROUGHNESS_LENGTH           = 0.002
SNP_SOIL                   = FALSE
SW_MODE                    = INCOMING

[SNOWPACKADVANCED]
ADJUST_HEIGHT_OF_METEO_VALUES        = true
ADJUST_HEIGHT_OF_WIND_VALUE          = true
ALBEDO_AGING                         = true
ALBEDO_AVERAGE_SCHMUCKI              = ALL_DATA
ALBEDO_PARAMETERIZATION              = LEHNING_2
ALLOW_ADAPTIVE_TIMESTEPPING          = TRUE
ALLOW_FREEZING_RAIN                  = true
ALPINE3D                             = false
COMBINE_ELEMENTS                     = true
DETECT_GRASS                         = false
ENFORCE_MEASURED_SNOW_HEIGHTS        = TRUE
FORCE_RH_WATER                       = true
HARDNESS_PARAMETERIZATION            = MONTI
HEIGHT_NEW_ELEM                      = 0.02
HN_DENSITY                           = PARAMETERIZED
HN_DENSITY_PARAMETERIZATION          = LEHNING_NEW
HOAR_DENSITY_BURIED                  = 125.
HOAR_DENSITY_SURF                    = 100.
HOAR_MIN_SIZE_BURIED                 = 2.
HOAR_MIN_SIZE_SURF                   = 0.5
HOAR_THRESH_RH                       = 0.97
HOAR_THRESH_TA                       = 1.2
HOAR_THRESH_VW                       = 3.5
LB_COND_WATERFLUX                    = FREEDRAINAGE
METAMORPHISM_MODEL                   = DEFAULT
MINIMUM_L_ELEMENT                    = 0.0025
MIN_DEPTH_SUBSURF                    = 0.07
NEW_SNOW_GRAIN_SIZE                  = 0.3
NUMBER_SLOPES                        = 5
PERP_TO_SLOPE                        = false
RESEARCH                             = true
SNOW_ALBEDO                          = PARAMETERIZED
SNOW_EROSION                         = false
SNOW_REDISTRIBUTION                  = false
STRENGTH_MODEL                       = DEFAULT
SW_ABSORPTION_SCHEME                 = MULTI_BAND
THRESH_RAIN                          = 1.2
THRESH_RH                            = 0.5
VARIANT                              = DEFAULT
VISCOSITY_MODEL                      = DEFAULT
WATERTRANSPORTMODEL_SNOW             = BUCKET
WATERTRANSPORTMODEL_SOIL             = BUCKET
WIND_SCALING_FACTOR                  = 1.0
