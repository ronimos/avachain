; master_config_forecast.ini — Little Professor (replay, Jan), NWP forecast pass only.
; Generated by install.py from slopes/little_prof_replay_jan/slope_config.toml.
;
; The observed passes drive SNOWPACK with measured HS
; (ENFORCE_MEASURED_SNOW_HEIGHTS = TRUE). WRF has no snow height, and with HS
; nodata that config stops at the first forecast step ("[E] missing { HS }")
; while still printing FINISHED, so the forecast pass never ran. This config
; imports the shared physics and switches the forecast to precipitation-driven:
; snowfall comes from PSUM (WRF MS_Snow + MS_Rain, nwp_ingest), split into
; snow or rain by the PSUM_PH generator in the shared config.

IMPORT_BEFORE = /home/ron/avachain/slopes/little_prof_replay_jan/config/master_config.ini

[SNOWPACK]
ENFORCE_MEASURED_SNOW_HEIGHTS = FALSE

[SNOWPACKADVANCED]
ENFORCE_MEASURED_SNOW_HEIGHTS = FALSE
