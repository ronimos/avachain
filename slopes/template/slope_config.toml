# slope_config.toml — per-slope configuration for the avachain pipeline
#
# Copy this file to slopes/<your_slope_name>/slope_config.toml,
# fill in every field, then run:
#
#   python install.py slopes/<your_slope_name>/slope_config.toml
#
# That creates the directory structure, generates the run scripts,
# and prints the crontab line.

# ---------------------------------------------------------------------------
# [slope] — identifying metadata for this slope
# ---------------------------------------------------------------------------
[slope]
name         = "template"        # short identifier, no spaces; used for directory names
display_name = "My Slope"        # human-readable label for plots and reports
aspect_deg   = 0.0               # predominant aspect, degrees clockwise from north (0 = N, 90 = E)
elevation_m  = 3000              # representative elevation of the release zone (m)
latitude     = 0.0               # approximate centre latitude (decimal degrees, positive north)
longitude    = 0.0               # approximate centre longitude (decimal degrees, negative west)
notes        = ""                # optional free-text notes

# ---------------------------------------------------------------------------
# [paths] — where data lives
# All paths except project_dir are resolved relative to project_dir.
# ---------------------------------------------------------------------------
[paths]
project_dir          = "/path/to/avachain"                   # absolute path to repo root
dem                  = "data/template/dem/dem.tif"
survey_dir           = "data/template/surveys"
weather_csv          = "data/template/weather/weather_data.csv"
boundary_kml         = "data/template/boundaries/boundary.kml"
start_zone_kml       = "data/template/boundaries/start_zone.kml"
release_geojson      = "data/template/boundaries/avalanche_release_area.geojson"
output_dir           = "outputs/template"
windninja_library_dir = "windninja/library"
slope_dir            = "snowpack/template"

# ---------------------------------------------------------------------------
# [snowpack] — SNOWPACK model settings
# ---------------------------------------------------------------------------
[snowpack]
binary     = "/home/caic/caic/rtsys/snowpack/exe/snowpack"
lib_dir    = "/home/caic/caic/rtsys/snowpack/src/snowpack/lib"
season_end = "YYYY-MM-DD"                       # SNOWPACK runs stop at this date (e.g. "2026-03-31")
max_parallel_jobs = 30                          # max simultaneous SNOWPACK processes

# ---------------------------------------------------------------------------
# [[stations]] — weather stations used for SMET forcing
# One entry per station. Roles "summit" and "base" are expected by the pipeline.
# sql_id must match the staname column in the SQL weather database.
# sql_columns are the column names to pull from the database (see sql_util.py).
# ---------------------------------------------------------------------------
[[stations]]
role        = "summit"
sql_id      = "STATION1"
name        = "My Summit Station"
lat         = 0.0
lon         = 0.0
elev_m      = 0.0
sql_columns = ["swin", "temp", "dewp", "rh", "wspd", "wdir", "gust", "mxtemp24h", "mntemp24h"]

[[stations]]
role        = "base"
sql_id      = "STATION2"
name        = "My Base Station"
lat         = 0.0
lon         = 0.0
elev_m      = 0.0
sql_columns = ["pcpac", "depth", "snow24h"]

# ---------------------------------------------------------------------------
# [scenarios] — release scenario parameters
# ---------------------------------------------------------------------------
[scenarios]
n_triggers         = 5
size_factors       = [0.70, 0.85, 1.00, 1.15, 1.30]
depth_percentiles  = [10, 50, 90]
stauchwall_deg     = 28.0

# ---------------------------------------------------------------------------
# [wrf] — WRF forecast forcing
# Used for the 48-hour forecast window and as gap-fill / fallback for slopes
# without a nearby AWS station.  install.py scans fcst_base_dir to find the
# closest grid cell and best aspect match; it writes the result back here.
# ---------------------------------------------------------------------------
[wrf]
fcst_base_dir = "/ssd/snowpack/fcst"
# Season directory name inside fcst_base_dir (e.g. "2026").
# Leave blank to let install.py pick the most recent year-based directory.
season        = ""
# Filled in by install.py — do not edit manually:
wrf_smet_dir  = ""   # abs path to the selected grid-cell directory
wrf_zone      = ""   # zone name (e.g. "zone088")
wrf_grid_id   = ""   # grid ID (e.g. "039566")
wrf_smet_file = ""   # abs path to the selected aspect-variant .smet file
wrf_dist_km   = 0.0  # distance from slope centre to WRF grid cell (km)

# ---------------------------------------------------------------------------
# [cron] — daily automation schedule
# hour_utc: UTC hour at which the pipeline fires each day.
#   03:00 UTC = 20:00 MST = evening after the afternoon UAS flight.
# ---------------------------------------------------------------------------
[cron]
hour_utc = 3
