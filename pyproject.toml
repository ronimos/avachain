[project]
name = "avachain"
version = "0.1.0"
description = "UAV snow surveys → distributed SNOWPACK → stability analysis → release scenarios → com1DFA runout probability"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fiona>=1.10.1",
    "folium>=0.20.0",
    "geopandas>=1.1.3",
    "matplotlib>=3.10.8",
    "opencv-python>=5.0.0.93",
    "pandas>=3.0.2",
    "pyarrow>=26.0.0",
    "pymysql>=1.1.2",
    "pyproj>=3.7.2",
    "python-dotenv>=1.2.2",
    "rasterio>=1.5.0",
    "requests>=2.33.1",
    "scikit-image>=0.26.0",
    "scikit-learn>=1.8.0",
    "scipy>=1.17.1",
    "shapely>=2.1.2",
    "sqlalchemy>=2.0.49",
    "sshtunnel>=0.4.0",
    "xarray>=2026.4.0",
    "zarr>=3.4.0",
    "dask>=2026.8.0",
    "xsnow",
]

[dependency-groups]
dev = ["pytest>=9.1.1"]

[tool.uv.sources]
# Pinned to the commit every 2026-10/11 acceptance run used (an editable
# checkout in ~/xsnow before this pin). Bump deliberately, then re-run acceptance.
xsnow = { git = "https://gitlab.com/avacollabra/postprocessing/xsnow.git", rev = "45d1db22a" }
